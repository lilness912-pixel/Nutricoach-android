name: Build NutriCoach APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf android-src
          mkdir android-src
          unzip -q NutriCoach-Android-source.zip -d android-src
          echo "PROJECT_DIR=$(find android-src -maxdepth 2 -type f -name settings.gradle -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" NutriCoach-Android-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriCoach-Android-test
          path: NutriCoach-Android-test.apk
